<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Terkunci</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #1e88e5, transparent 35%),
                radial-gradient(circle at bottom right, #003c8f, transparent 40%),
                linear-gradient(135deg, #001f4d, #0066cc);

            color: white;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 45px 35px;
            text-align: center;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);

            animation: muncul 0.8s ease;
        }

        @keyframes muncul {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lock-icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;

            background: rgba(255, 255, 255, 0.15);

            border-radius: 50%;

            box-shadow:
                0 0 30px rgba(30, 136, 229, 0.6);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #d7eaff;

            margin-bottom: 30px;

            line-height: 1.6;
        }

        .input-box {
            margin-bottom: 15px;
        }

        input {
            width: 100%;

            padding: 15px 18px;

            border: none;
            outline: none;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.95);

            color: #123;

            font-size: 15px;

            transition: 0.3s;
        }

        input:focus {
            box-shadow:
                0 0 0 3px rgba(30, 136, 229, 0.5),
                0 0 20px rgba(30, 136, 229, 0.4);
        }

        input::placeholder {
            color: #777;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #2196f3,
                #0066cc
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 8px 20px rgba(0, 102, 204, 0.4);
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(0, 102, 204, 0.6);
        }

        button:active {
            transform: scale(0.98);
        }

        #pesan {
            margin-top: 15px;

            font-size: 14px;

            color: #ffb3b3;

            min-height: 20px;
        }

        .footer {
            margin-top: 30px;

            font-size: 11px;

            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="lock-icon">🔒</div>

        <h1>Website Terkunci</h1>

        <p class="subtitle">
            Masukkan password untuk mengakses website
        </p>

        <div class="input-box">
            <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                onkeypress="tekanEnter(event)"
            >
        </div>

        <button onclick="bukaWebsite()">
            🔓 Buka Website
        </button>

        <p id="pesan"></p>

        <div class="footer">
            © 2026 SMABARRUNVOLL2
        </div>

    </div>

    <script>
        function bukaWebsite() {

            const password =
                document.getElementById("password").value;

            if (password === "RunSmabar2026") {

                window.location.href = "beranda.html";

            } else {

                document.getElementById("pesan").innerText =
                    "❌ Password salah! Silakan coba lagi.";

            }
        }

        function tekanEnter(event) {

            if (event.key === "Enter") {
                bukaWebsite();
            }

        }
    </script>

</body>
</html>
